// ===== Karmiel — L-shaped SKYTEKS Roll roof 7.50 x 5.25 m + sliding glass on 3 sides, h 2.70 m =====
M.alu.color.set(0x383e42);                                   // RAL 7016
const slatM=new THREE.MeshStandardMaterial({color:0xcfd1d0,roughness:.45,metalness:.45}); // RAL 7047
const plaster=new THREE.MeshStandardMaterial({color:0xa9a49b,roughness:.95});
const concrete=new THREE.MeshStandardMaterial({color:0x8f8a82,roughness:.95});
const glassP=new THREE.MeshStandardMaterial({color:0x9fc3d6,roughness:.05,metalness:.2,transparent:true,opacity:.28,side:THREE.DoubleSide});
const deck=new THREE.MeshStandardMaterial({color:0x6b4a36,roughness:.8});
const grass=new THREE.MeshStandardMaterial({color:0x5f9a3a,roughness:1});
const g=new THREE.Group();S.add(g);
const H=2.70, W=7.50, D=5.25, Db=2.55, Wb=4.90;
// ground, deck
const gr=new THREE.Mesh(new THREE.PlaneGeometry(30,24),grass);gr.rotation.x=-Math.PI/2;gr.position.set(3.75,0,4);gr.receiveShadow=true;g.add(gr);
box(W,.04,D,deck,W/2,.02,D/2,g);
// house: ground-floor wall, upper floor, existing concrete balcony over x 4.9–7.5
box(12,2.95,.35,plaster,3.0,1.475,-.175,g);
box(12,3.2,.35,plaster,3.0,4.55,-.6,g);                 // upper floor (set back)
box(2.6,2.3,.05,M.glass,2.4,1.15,.01,g);box(2.7,.08,.08,M.dark,2.4,2.32,.03,g);   // sliding door
box(1.4,.9,.05,M.glass,6.2,1.55,.01,g);                  // window
box(2.75,.35,Db+.1,concrete,Wb+1.3,H+.18,(Db+.1)/2,g); // balcony slab
box(2.75,.9,.03,glassP,Wb+1.3,H+.8,Db+.08,g);
box(.25,2.4,10,new THREE.MeshStandardMaterial({color:0xbfb8aa,roughness:.9}),-.35,1.2,4,g); // neighbor temporary wall (C)
// ---- SKYTEKS Roll units (slats span along z, stack toward x0 when opening)
const units2=[];
function roll(x0,z0,w,d){
 const u={g:new THREE.Group(),x0,z0,w,d,sl:[]};g.add(u.g);
 const y=H+.06;
 box(w,.2,.14,M.alu,x0+w/2,y,z0+.07,u.g);box(w,.2,.14,M.alu,x0+w/2,y,z0+d-.07,u.g);
 box(.14,.2,d,M.alu,x0+.07,y,z0+d/2,u.g);box(.14,.2,d,M.alu,x0+w-.07,y,z0+d/2,u.g);
 const n=Math.floor((w-.2)/.206);
 for(let i=0;i<n;i++){const s=box(.2,.035,d-.24,slatM,0,y+.04,z0+d/2,u.g);u.sl.push(s)}
 for(let i=1;i<4;i++){const p=new THREE.PointLight(0xffe2b8,0,6,2);p.position.set(x0+w*i/4,H-.25,z0+d/2);u.g.add(p);lamps.push(p)}
 units2.push(u);return u}
roll(0,Db,W,D-Db);       // 7.50 x 2.70
roll(0,0,Wb,Db);         // 4.90 x 2.55
setOpen=function(t){units2.forEach(u=>{const n=u.sl.length,full=(u.w-.2)/n,st=.05;
 u.sl.forEach((s,i)=>{const closedX=u.x0+.1+full*(i+.5),openX=u.x0+.12+st*(i+.5);
  s.position.x=closedX+(openX-closedX)*t;s.rotation.x=0;s.rotation.z=t*1.45;})})};
// posts (included) at outer corners + middle of front
[[.07,D-.07],[W-.07,D-.07],[W/2,D-.07],[W-.07,Db]].forEach(([x,z])=>box(.13,H,.13,M.alu,x,H/2,z,g));
// ---- Sürme Plus sliding glass, 20 mm, h 2.70 — sides A (x=W), C (x=0), front B (z=D)
function slide(ax,a0,a1,fixed,panels){
 const L=a1-a0,pw=L/panels,mk=(cx,w,off)=>ax==='z'?[cx,off]:[off,cx];
 const along=(c,w,h,y,o)=>{const [x,z]=mk(c,w,o);return ax==='z'?box(w,h,.03,glassP,x,y,fixed+o,g):box(.03,h,w,glassP,fixed+o,y,x,g)};
 for(let i=0;i<panels;i++){const c=a0+pw*(i+.5),o=(i%2?.05:-.05);
  along(c,pw,H-.16,H/2,o);
  const fr=(w,h,y,cc)=>ax==='z'?box(w,h,.05,M.alu,cc,y,fixed+o,g):box(.05,h,w,M.alu,fixed+o,y,cc,g);
  fr(.05,H-.16,H/2,c-pw/2+.025);fr(.05,H-.16,H/2,c+pw/2-.025);}
 const rail=(y)=>ax==='z'?box(L,.08,.16,M.alu,a0+L/2,y,fixed,g):box(.16,.08,L,M.alu,fixed,y,a0+L/2,g);rail(.04);rail(H-.04);}
slide('z',.13,W-.13,D-.07,8);   // front B (2 units x 4)
slide('x',.13,D-.13,W-.07,6);   // side A
slide('x',.13,D-.13,.07,6);     // side C
SP.start({
 views:{all:[[12.5,4.6,13.5],[3.6,1.4,2.6]], side:[[-5.5,5.5,11],[3.6,1.6,2.6]], inside:[[6.8,1.5,4.9],[2.2,3.1,1.6]]},

 labels:{open:'פתיחת הגג',night:'לילה'}
});
