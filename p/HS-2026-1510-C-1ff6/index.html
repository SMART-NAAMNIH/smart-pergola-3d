<body>
<canvas id="c"></canvas>
<div class="bar"><div><b>SMART</b> Pergola<small>كفر برا · عفيف درع · SKYTEKS Roll 1600 · RAL 7016 / 7047</small></div></div>
<div class="panel" id="panel"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>

<script>
// ===== SKYTEKS — مشهد المشروع (بالمتر). الجدار على z=0 والبروز نحو +z =====
M.alu.color.set(0x383e42);                                   // RAL 7016
const LV=new THREE.MeshStandardMaterial({color:0xcfd0cf,roughness:.5,metalness:.25}); // RAL 7047
const PL=new THREE.MeshStandardMaterial({color:0xe2d6bd,roughness:.9});             // plaster
const PC=new THREE.MeshStandardMaterial({color:0xdfe8ec,roughness:.25,metalness:.05,transparent:true,opacity:.55}); // سنتاف PH
const MODE='roll';  // slide | roll | fix (default for units)
// sky(g, x0, LX, LZ, h, opt): unit on the floor of group g; louvers span along opt.span ('x' default) and stack along the other axis
function sky(g,x0,LX,LZ,h,opt){opt=opt||{};const u={g:new THREE.Group(),sky:true,mode:opt.mode||MODE,span:opt.span||'x',lv:[]};g.add(u.g);
 const z0=.05,b=.2,ph=.2;
 box(LX,ph,.14,M.alu,x0+LX/2,h,z0,u.g);box(LX,ph,.16,M.alu,x0+LX/2,h,z0+LZ,u.g);
 box(.14,ph,LZ,M.alu,x0,h,z0+LZ/2,u.g);box(.14,ph,LZ,M.alu,x0+LX,h,z0+LZ/2,u.g);
 [[x0,z0+LZ],[x0+LX,z0+LZ]].concat(opt.mid?[[x0+LX/2,z0+LZ]]:[]).forEach(([x,z])=>box(.15,h-ph/2,.15,M.alu,x,(h-ph/2)/2,z,u.g));
 if(u.mode!=='pc'){box(LX-.3,.012,.03,M.led,x0+LX/2,h-.11,z0+LZ-.12,u.g);box(LX-.3,.012,.03,M.led,x0+LX/2,h-.11,z0+.12,u.g);
 const p=new THREE.PointLight(0xffd9a0,0,7,2);p.position.set(x0+LX/2,h-.5,z0+LZ/2);u.g.add(p);lamps.push(p);}
 if(u.mode==='pc'){const k=Math.ceil(LX/3.5);for(let i=1;i<k;i++)box(.15,h-ph/2,.15,M.alu,x0+LX*i/k,(h-ph/2)/2,z0+LZ,u.g);
  const r=Math.max(2,Math.round(LX/.9)+1);for(let i=0;i<r;i++)box(.06,.12,LZ,M.alu,x0+.07+(LX-.14)*i/(r-1),h+.12,z0+LZ/2,u.g);
  const sh=box(LX-.1,.012,LZ-.05,PC,x0+LX/2,h+.19,z0+LZ/2,u.g);sh.castShadow=false;u.place=()=>{};units.push(u);return u}
 const run=u.span==='x'?LZ:LX,len=(u.span==='x'?LX:LZ)-.16,n=Math.floor((run-.1)/.206);u.run=run;u.n=n;
 for(let i=0;i<n;i++){const m=new THREE.Mesh(new THREE.BoxGeometry(u.span==='x'?len:.2,.028,u.span==='x'?.2:len),LV);m.castShadow=m.receiveShadow=true;
  m.userData.s=.05+.103+i*.206;u.g.add(m);u.lv.push(m)}
 u.place=(t)=>{const rot=u.mode==='fix'?0:u.mode==='roll'?Math.PI/2*t:Math.min(1,t/.4)*52*Math.PI/180;
  const st=u.mode==='slide'?Math.max(0,(t-.4)/.6):0;
  u.lv.forEach((m,i)=>{const s0=m.userData.s,s=s0-(s0-.12-i*.06)*st;
   if(u.span==='x'){m.position.set(x0+LX/2,h+.02,z0+s);m.rotation.set(rot,0,0)}else{m.position.set(x0+s,h+.02,z0+LZ/2);m.rotation.set(0,0,-rot)}})};
 u.place(0);units.push(u);return u}
setFabric=function(u,t){if(u.sky)u.place(t)};
// ---- الأرضية والمبنى
const fl=new THREE.Mesh(new THREE.PlaneGeometry(40,30),new THREE.MeshStandardMaterial({map:(()=>{const t=TT.clone();t.needsUpdate=true;t.repeat.set(40/.8,30/.8);return t})(),roughness:.8}));
fl.rotation.x=-Math.PI/2;fl.position.set(7,0,6);fl.receiveShadow=true;S.add(fl);
box(18.6,3.3,.4,stoneMat(18.6,3.3),7.7,1.65,-.2);box(18.6,5,.4,PL,7.7,5.8,-.2);          // main facade
box(.4,3.3,12,stoneMat(12,3.3),-1.4,1.65,-6.2);box(.4,5,12,PL,-1.4,5.8,-6.2);           // side wall (zone 3)
box(4.2,1.1,2.2,M.dark,3.5,3.85,1.1);box(4.2,1.2,.04,M.glass,3.5,5,2.2);               // upper balcony
[[1.6,1.2],[5.2,1.2],[10.6,1.2],[13.1,1.2]].forEach(([x,y])=>{box(2.2,2.4,.05,M.glass,x,y,.01);box(2.3,.08,.08,M.dark,x,2.44,.03)});
box(.45,3.3,.45,stoneMat(.45,3.3),7.55,1.65,.2);                                         // stone pier between zones
const rail=new THREE.MeshStandardMaterial({color:0x2a2d30,roughness:.6,metalness:.4});
box(.25,.35,26,PL,18,.17,0);box(.05,1.1,26,rail,18,.9,0);box(27,.35,.25,PL,4.5,.17,13);box(27,1.1,.05,rail,4.5,.9,13);box(.25,.35,26,PL,-9,.17,0);box(.05,1.1,26,rail,-9,.9,0);
// ---- الوحدات
const h=2.9;
sky(S,0,6.95,4.25,h,{mode:'roll',span:'z',mid:true});
sky(S,7.800,3.05,4.5,h);
sky(S,10.850,3.05,4.5,h);
const G3=new THREE.Group();G3.rotation.y=-Math.PI/2;G3.position.set(-1.6,0,-9.35);S.add(G3);
sky(G3,0,9.1,3.1,h,{mode:'pc'});
sky(S,14.4,2.55,2.0,h,{mode:'pc'});
SP.start({
 views:{all:[[-13,10,19],[5,1.2,0]], side:[[19,5,12],[8,2,2]], inside:[[8.6,1.5,.7],[10.5,2.15,9]], z3:[[-11,5,3],[-3,1.8,-5]]},
 projects:[{label:'المشروع كاملاً',view:'all'},{label:'المنطقة 3 (الجانب)',view:'z3'},{label:'من الداخل',view:'inside'}]
});
</script>
