<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Smart Pergola · تصميم ثلاثي الأبعاد · HS-2026-1911-C</title>
<link rel="stylesheet" href="../../viewer/viewer.css">
</head>
<body>
<canvas id="c"></canvas>
<div class="bar"><div><b>SMART</b> Pergola<small>عيلوط · شبابيك غيوتين كهربائية GİYOTİN 1500 · زجاج معزول 20 ملم · RAL 9016</small></div></div>
<div class="panel" id="panel"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="../../viewer/engine.js"></script>
<script>
// ===== السطح العلوي: حفة مكسوة + شايش + درابزين حديد + برجولا قائمة + 4 شبابيك غيوتين =====
const g=new THREE.Group();S.add(g);
const white=new THREE.MeshStandardMaterial({color:0xf3f1ea,roughness:.5,metalness:.2});
const louv=new THREE.MeshStandardMaterial({color:0x3a3f47,roughness:.5,metalness:.3});
const clad=new THREE.MeshStandardMaterial({color:0xcdb791,roughness:.8});
const iron=new THREE.MeshStandardMaterial({color:0x8d9399,roughness:.5,metalness:.5});
const gl=new THREE.MeshStandardMaterial({color:0x6f9fb8,roughness:.05,metalness:.4,transparent:true,opacity:.5});
const W1=3.2,W2=3.2,WL=1.3,WR=2.45,D=2.45,PH=1.0,CAP=.06,GH=1.5;
const X0=0,X1=W1+W2;                    // front from x=0 to 6.4 at z=D
const TOPY=PH+CAP, beamY=TOPY+GH+.02;
// floor
const fl=new THREE.Mesh(new THREE.PlaneGeometry(14,10),new THREE.MeshStandardMaterial({map:(()=>{const t=TT.clone();t.needsUpdate=true;t.repeat.set(14/.8,10/.8);return t})(),roughness:.8}));
fl.rotation.x=-Math.PI/2;fl.position.set(3.2,0,1.5);fl.receiveShadow=true;g.add(fl);
// parapets (front, left part, right side)
function parapet(len,x,z,rot){const p=new THREE.Group();p.position.set(x,0,z);p.rotation.y=rot;g.add(p);
 box(len,PH,.25,clad,len/2,PH/2,0,p);box(len+.1,CAP,.38,M.cap,len/2,PH+CAP/2,0,p);
 // iron railing on the outer edge of the cap
 box(len,.03,.03,iron,len/2,TOPY+.9,.15,p);box(len,.03,.03,iron,len/2,TOPY+.08,.15,p);
 for(let s=.06;s<len;s+=.13)box(.018,.85,.018,iron,s,TOPY+.48,.15,p);
 return p}
parapet(X1,X0,D,0);                       // front 6.4
parapet(D,X0,0,-Math.PI/2);               // left side (z 0..D)
parapet(D,X1,D,Math.PI/2);                // right side
box(.4,3.2,10,stoneMat(10,3.2),-3.5,1.6,1.5,g); // neighbouring building hint (back)
// existing pergola (white frame, dark louvres, LED)
const posts=[[X0,D],[W1,D],[X1,D],[X0,0],[X1,0]];
posts.forEach(([x,z])=>box(.15,beamY+.2,.15,white,x,(beamY+.2)/2,z,g));
box(X1+.15,.22,.15,white,X1/2,beamY+.11,D,g);box(X1+.15,.22,.15,white,X1/2,beamY+.11,0,g);
box(.15,.22,D,white,X0,beamY+.11,D/2,g);box(.15,.22,D,white,X1,beamY+.11,D/2,g);
for(let x=.18;x<X1-.05;x+=.2)box(.17,.03,D-.15,louv,x,beamY+.16,D/2,g);
[[X1/2,D-.09,X1,.02],[X1/2,.09,X1,.02]].forEach(([x,z,w])=>{const l=box(w,.02,.03,M.led,x,beamY-.005,z,g);leds.push(l)});
// guillotine units: placed on the cap, inside (beside) the iron railing
const sashes=[];
function giyotin(len,x,z,rot){const p=new THREE.Group();p.position.set(x,TOPY,z);p.rotation.y=rot;g.add(p);
 const zi=-.07; // inner side of cap
 box(.06,GH,.1,white,.03,GH/2,zi,p);box(.06,GH,.1,white,len-.03,GH/2,zi,p);       // side profiles
 box(len,.08,.12,white,len/2,.04,zi,p);box(len,.1,.12,white,len/2,GH-.05,zi,p);  // bottom/TOPY box (motor)
 const h=(GH-.18)/2;
 const lo=new THREE.Group();lo.position.set(0,.08,zi-.025);p.add(lo);
 box(len-.12,h,.02,gl,len/2,h/2,0,lo);box(len-.12,.03,.03,white,len/2,h-.015,0,lo);
 const up=new THREE.Group();up.position.set(0,.08+h,zi+.025);p.add(up);
 box(len-.12,h,.02,gl,len/2,h/2,0,up);box(len-.12,.03,.03,white,len/2,.015,0,up);
 sashes.push({up,y0:.08+h,h});}
giyotin(W1,X0,D,0);giyotin(W2,W1,D,0);
giyotin(WL,X0,D-WL,-Math.PI/2);          // left 1.30 (front corner)
giyotin(WR,X1,D,Math.PI/2);           // right 2.45
// override open: upper sash slides down
setOpen=function(t){sashes.forEach(s=>s.up.position.y=s.y0-t*s.h*.98)};
SP.start({
 views:{all:[[3.2,3.4,9.6],[3.2,1.6,1.2]], side:[[10.5,3.2,6.5],[3.6,1.6,1.2]], inside:[[1.0,1.65,.6],[4.2,1.7,2.45]]},
 projects:[{label:'منظر عام',view:'all'},{label:'من الجانب',view:'side'},{label:'من الداخل',view:'inside'}],
 labels:{open:'فتح الشبابيك',night:'ليلي'}
});
</script>
</body>
