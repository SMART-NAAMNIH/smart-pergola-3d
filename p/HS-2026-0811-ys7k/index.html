<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Smart Pergola · تصميم ثلاثي الأبعاد · HS-2026-0811</title>

</head>
<body>
<canvas id="c"></canvas>
<div class="bar"><div><b>SMART</b> Pergola<small>كفر قرع · SKYTEKS ROLL 1600 · 4.0×6.0 م · RAL 1013</small></div></div>
<div class="panel" id="panel"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="../../viewer/engine.js"></script>
<script>
// ===== المشهد: بيت ترافرتين، مصطبة مرفوعة مع درابزين زجاج، حزام باطوني قائم، ووحدة SKYTEKS ROLL فوقه =====
M.alu.color.set(0xe6dccb); M.alu.roughness=.5; M.alu.metalness=.25;   // RAL 1013 pearl white
const slatMat=new THREE.MeshStandardMaterial({color:0xe9e0cf,roughness:.45,metalness:.25});
const conc=new THREE.MeshStandardMaterial({color:0xe9e7e1,roughness:.85});
const deckMat=new THREE.MeshStandardMaterial({color:0x2b2b2d,roughness:.35,metalness:.1});
const railGlass=new THREE.MeshStandardMaterial({color:0xb9d4d6,roughness:.05,metalness:.1,transparent:true,opacity:.28});
const G=new THREE.Group();S.add(G);
const W=4.0,D=6.0,X0=1.0;            // unit along wall from x=1..5, projecting 6 m
const DH=.6;                         // raised deck height
const BT=DH+2.75;                    // top of existing concrete beam
const PH=.6;                         // columns on concrete
const FT=BT+PH;                      // bottom of pergola frame
(function(){
 const g=G;
 const fl=new THREE.Mesh(new THREE.PlaneGeometry(22,18),new THREE.MeshStandardMaterial({map:(()=>{const t=TT.clone();t.needsUpdate=true;t.repeat.set(22/.6,18/.6);return t})(),roughness:.85}));
 fl.rotation.x=-Math.PI/2;fl.position.set(3,0,5);fl.receiveShadow=true;g.add(fl);
 box(14,8.2,.4,stoneMat(14,8.2),3,4.1,-.2,g);                                   // house wall
 box(2.6,2.3,.05,M.glass,3.4,DH+1.15,.01,g); box(2.7,1.1,.08,M.cap,3.4,DH+2.85,.03,g); // sliding door + shutter box
 box(.7,2.2,.05,M.cap,.0,DH+1.3,.02,g);
 box(7.5,DH,7.2,stoneMat(7.5,DH),2.6,DH/2,3.6,g);                                 // raised stone base
 box(7.4,.04,7.1,deckMat,2.6,DH+.02,3.55,g);                                      // dark deck
 box(7.3,1.0,.03,railGlass,2.6,DH+.55,7.12,g);                                    // glass railings
 box(.03,1.0,7.0,railGlass,6.3,DH+.55,3.6,g);
 // existing concrete frame (חגורת בטון) with stone columns and white rafter blocks
 [[X0-.25,D+.05],[X0+W+.25,D+.05]].forEach(([x,z])=>box(.5,BT-DH,.5,stoneMat(.5,2.7),x,DH+(BT-DH)/2,z,g));
 box(W+1.0,.45,.45,conc,X0+W/2,BT-.22,D+.05,g);                                    // front beam
 box(.45,.45,D,conc,X0-.25,BT-.22,D/2,g); box(.45,.45,D,conc,X0+W+.25,BT-.22,D/2,g); // side beams
 box(W+1.0,.45,.45,conc,X0+W/2,BT-.22,.25,g);                                      // wall-side beam
 for(let i=0;i<7;i++){const x=X0-.6+i*(W+1.2)/6;box(.4,.4,.7,conc,x,BT+.05,D+.15,g)}   // decorative blocks
})();
// ===== SKYTEKS ROLL unit: frame + aluminium slats (20.6 cm), stacking toward the wall when opened
const sky={slats:[],D,W};
(function(){
 const g=new THREE.Group();G.add(g);
 const posts=[[X0-.25,.25],[X0+W+.25,.25],[X0-.25,D+.05],[X0+W+.25,D+.05]];
 posts.forEach(([x,z])=>box(.15,PH,.15,M.alu,x,BT+PH/2,z,g));                   // 60 cm columns on concrete
 box(W+.65,.22,.16,M.alu,X0+W/2,FT+.11,.25,g); box(W+.65,.22,.16,M.alu,X0+W/2,FT+.11,D+.05,g);
 box(.16,.22,D-.2+.16,M.alu,X0-.25,FT+.11,D/2+.15,g); box(.16,.22,D-.2+.16,M.alu,X0+W+.25,FT+.11,D/2+.15,g);
 // LED strips on inner side of the side beams
 [X0-.16,X0+W+.16].forEach(x=>{const l=box(.02,.02,D-.4,M.led,x,FT+.03,D/2+.15,g);leds.push(l)});
 for(let k=0;k<3;k++){const p=new THREE.PointLight(0xffd9a0,0,7,2);p.position.set(X0+W/2,FT-.4,1+k*2.1);g.add(p);lamps.push(p)}
 const n=Math.round((D-.2)/.206);
 for(let i=0;i<n;i++){const m=box(W+.3,.05,.2,slatMat,X0+W/2,FT+.17,.35+i*.206,g);sky.slats.push(m)}
})();
setOpen=function(t){const n=sky.slats.length;sky.slats.forEach((m,i)=>{
  const closedZ=.35+i*.206, stackZ=.35+i*.03; m.position.z=closedZ+(stackZ-closedZ)*t; m.position.y=FT+.17+(t>0?i*.0006*t:0)})};
SP.start({
 views:{all:[[-6.5,6.5,15],[3,2.6,3]], side:[[12.5,5.2,10.5],[3,2.8,3]], inside:[[4.6,2.5,5.7],[2.6,2.35,0.3]]},
 projects:[{label:'برجولا SKYTEKS ROLL',view:'all'}]
});
</script>
