<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Smart Pergola · הדמיה תלת־ממדית · HS-2026-1910</title>
<link rel="stylesheet" href="../../viewer/viewer.css">
</head>
<body>
<canvas id="c"></canvas>
<div class="bar"><div><b>SMART</b> Pergola<small>חיפה · SKYTEKS Roll 1400 + Zip · RAL 7016</small></div></div>
<div class="panel" id="panel"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="../../viewer/engine.js"></script>
<script>
// ===== Haifa — SKYTEKS Roll 1400 319x537 on house wall h305, fixed strip 35 cm + Zip 512x320 =====
M.alu.color.set(0x383e42);                      // RAL 7016
const ZF=new THREE.MeshStandardMaterial({color:0x4a4f52,roughness:.9,transparent:true,opacity:.82,side:THREE.DoubleSide});
const W=3.19,D=5.37,hb=3.05,hf=2.85,T=.30;      // roof, side wall thickness
const H=z=>hb+(hf-hb)*z/D;
const g=new THREE.Group();S.add(g);
// floor
const fl=new THREE.Mesh(new THREE.PlaneGeometry(14,12),new THREE.MeshStandardMaterial({map:(()=>{const t=TT.clone();t.needsUpdate=true;t.repeat.set(14/.8,12/.8);return t})(),roughness:.8}));
fl.rotation.x=-Math.PI/2;fl.position.set(2.5,0,3.5);fl.receiveShadow=true;g.add(fl);
// house wall (z<0) with glass door
box(9,4.2,.4,stoneMat(9,4.2),1.6,2.1,-.2,g);
box(2.2,2.4,.05,M.glass,1.5,1.2,.01,g);
// side stone wall 537 long, h305, with opening (stone frame)
const xw=W+T/2;
box(T,hb,.5,stoneMat(.5,hb),xw,hb/2,.25,g);
box(T,hb,.6,stoneMat(.6,hb),xw,hb/2,D-.3,g);
box(T,.9,D-1.1,stoneMat(D-1.1,.9),xw,hb-.45,D/2,g);
// low gable wall at far end (h142) — gutter outlet
box(W+T,1.42,.3,stoneMat(W,1.42),W/2+.15,.71,D+.15,g); box(W+T+.1,.06,.4,M.cap,W/2+.15,1.45,D+.15,g);
const spout=box(.12,.12,.25,M.alu,.25,1.55,D+.42,g);
// railing beyond zip
const xr=xw+T/2+.35+.6;
for(let i=0;i<6;i++)box(.02,.02,D+.6,M.dark,xr,.15+i*.18,D/2,g);
box(.05,.05,D+.6,M.dark,xr,1.05,D/2,g);
// --- SKYTEKS Roll frame
beam(V(0,hb,.06),V(W,hb,.06),.12,.2,M.alu,g);                 // wall profile
beam(V(.07,hb,.06),V(.07,hf,D),.14,.22,M.alu,g);               // side rails
beam(V(W-.07,hb,.06),V(W-.07,hf,D),.14,.22,M.alu,g);
beam(V(0,hf,D),V(W,hf,D),.16,.24,M.alu,g);                     // front gutter beam
box(.13,hf-1.42,.13,M.alu,.07,1.42+(hf-1.42)/2,D,g);           // front post on low wall
// LED lines in side rails
[.16,W-.16].forEach(x=>{leds.push(beam(V(x,hb-.12,.3),V(x,hf-.12,D-.1),.03,.012,M.led,g))});
[[W/2,1.4],[W/2,4]].forEach(([x,z])=>{const p=new THREE.PointLight(0xffd9a0,0,7,2);p.position.set(x,2.3,z);g.add(p);lamps.push(p)});
// slats (pitch 17.3 cm) — stack toward house wall when opened
const slats=new THREE.Group();g.add(slats);const N=Math.ceil((D-.2)/.173);
function drawSlats(t){slats.clear();const pitch=.173*(1-t)+.03*t;
 for(let k=0;k<N;k++){const z=.15+k*pitch+.08;if(z>D-.05)break;
  box(W-.28,.03,.165,M.alu,W/2,H(z)+.02,z,slats)}}
setOpen=function(t){drawSlats(t)};
// --- fixed strip 35 cm (composite) from wall top to zip, length 544
const xz=xw+T/2+.35, L=5.44, z0=(D-L)/2, hz=3.20;
box(.35+T,.08,L,M.alu,xw+.175,hz+.04,D/2,g);                 // composite roof strip
box(.06,.18,L,M.alu,xz,hz-.09,D/2,g);                        // zip head box
[z0+.08,z0+L-.08].forEach(z=>box(.12,hz,.12,M.alu,xz,hz/2,z,g));   // 2 posts
const zip=new THREE.Mesh(new THREE.PlaneGeometry(5.12,hz-.2),ZF);zip.rotation.y=Math.PI/2;zip.position.set(xz,(hz-.2)/2,D/2);g.add(zip);
box(.05,.04,5.12,M.alu,xz,.03,D/2,g);
SP.start({
 views:{persp:[[-4.6,4.8,10.2],[2.2,1.6,2.6]], side:[[10.5,3.6,7.5],[2.6,1.8,2.6]], inside:[[1.4,1.6,4.9],[2.6,2.4,0.6]], top:[[-3.5,8.5,9.5],[1.8,2.2,2.4]]},
 projects:[{label:'מבט כללי',view:'persp'},{label:'צד ה-Zip',view:'side'}],
 labels:{open:'פתיחת הגג',night:'לילה'}
});
</script>
</body>
</html>
