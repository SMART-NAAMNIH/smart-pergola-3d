const G=new THREE.Group();S.add(G);
const W=5.7,D=4.3,hb=2.6,hf=2.5;
(function(){
 const g=G;
 const fl=new THREE.Mesh(new THREE.PlaneGeometry(14,10),new THREE.MeshStandardMaterial({map:(()=>{const t=TT.clone();t.needsUpdate=true;t.repeat.set(14/.8,10/.8);return t})(),roughness:.8}));
 fl.rotation.x=-Math.PI/2;fl.position.set(3,0,2.5);fl.receiveShadow=true;g.add(fl);
 box(9.6,3.6,.4,stoneMat(9.6,3.6),1.2,1.8,-.2,g);                                   // house wall
 box(1.6,2.3,.05,M.glass,3.6,1.15,.01,g);box(1.75,.1,.07,M.dark,3.6,2.32,.02,g);    // door
 box(1.0,1.2,.05,M.glass,1.3,1.5,.01,g);
 box(W+2.6,.95,.22,stoneMat(W+2.6,.95),W/2+.6,.475,D+.2,g);box(W+2.7,.06,.3,M.cap,W/2+.6,.98,D+.2,g); // parapet (long side)
 box(W+2.6,.8,.02,new THREE.MeshStandardMaterial({color:0xcfe6ee,transparent:true,opacity:.18}),W/2+.6,1.41,D+.2,g); // glass rail
 const sl=box(4.6,.95,.22,stoneMat(4.6,.95),-1.0,.475,2.15,g);sl.rotation.y=-Math.atan2(D,1.7)+Math.PI/2;      // slanted wall (triangle)
 box(.22,.95,D+.3,stoneMat(D,.95),W+1.9,.475,2.1,g);                                 // far parapet beyond yellow line
})();
// Zip شفاف على الجوانب الثلاثة
const zipMat=new THREE.MeshStandardMaterial({color:0xdde9ee,transparent:true,opacity:.28,side:THREE.DoubleSide,roughness:.2});
function zip(x1,z1,x2,z2,y0,y1){const L=Math.hypot(x2-x1,z2-z1);const m=new THREE.Mesh(new THREE.PlaneGeometry(L,y1-y0),zipMat);
 m.position.set((x1+x2)/2,(y0+y1)/2,(z1+z2)/2);m.rotation.y=-Math.atan2(z2-z1,x2-x1);G.add(m);
 const bx=box(L,.11,.11,M.alu,(x1+x2)/2,y1+.02,(z1+z2)/2,G);bx.rotation.y=m.rotation.y;
 [[x1,z1],[x2,z2]].forEach(([x,z])=>box(.05,y1-y0,.05,M.alu,x,(y0+y1)/2,z,G))}
zip(.1,D+.15,2.85,D+.15,1.0,hf-.1);zip(2.85,D+.15,5.6,D+.15,1.0,hf-.1);
zip(.04,.1,.04,2.15,0,2.4);zip(.04,2.15,.04,D,0,2.4);zip(W-.04,.1,W-.04,2.15,0,2.4);zip(W-.04,2.15,W-.04,D,0,2.4);

M.alu.color.set(0x383e42);const slatMat=new THREE.MeshStandardMaterial({color:0xe3d9a6,roughness:.5,metalness:.3});
const sk=[];
function skyUnit(x0,Wu){const g=new THREE.Group();G.add(g);const H=z=>hb+(hf-hb)*z/D;
 beam(V(x0,hb+.05,.06),V(x0+Wu,hb+.05,.06),.12,.2,M.alu,g);
 beam(V(x0,hf,D),V(x0+Wu,hf,D),.15,.2,M.alu,g);
 [x0+.05,x0+Wu-.05].forEach(x=>{beam(V(x,hb,.06),V(x,hf,D),.1,.2,M.alu,g);
   const l=beam(V(x+(x<x0+1?.07:-.07),hb-.11,.3),V(x+(x<x0+1?.07:-.07),hf-.11,D-.1),.02,.012,M.led,g);leds.push(l)});
 box(.12,hf-.1,.12,M.alu,x0+.06,(hf-.1)/2,D,g);box(.12,hf-.1,.12,M.alu,x0+Wu-.06,(hf-.1)/2,D,g);
 const p=new THREE.PointLight(0xffd9a0,0,6,2);p.position.set(x0+Wu/2,hb-.6,D/2);g.add(p);lamps.push(p);
 const n=Math.round((D-.15)/.173),s=[];
 for(let k=0;k<n;k++){const m=box(Wu-.2,.03,.165,slatMat,x0+Wu/2,0,0,g);s.push(m)}
 sk.push({s,H,n})}
skyUnit(0,W/2);skyUnit(W/2,W/2);
setOpen=function(t){sk.forEach(u=>u.s.forEach((m,k)=>{const zc=.15+.173*k*(1-t)+.035*k*t+.08;m.position.z=zc;m.position.y=u.H(zc)+.02+(t>0?.02*k*t/u.n:0);m.rotation.x=t*1.0}))};
SP.start({views:{all:[[-3.2,4.2,9.2],[2.9,1.2,2]],side:[[10.5,3.4,6.5],[2.9,1.3,2]],inside:[[4.8,1.7,.8],[1.5,2.3,3.6]],top:[[2.9,9,6],[2.9,0,2]]},projects:[{label:'السطح · SKYTEKS Pearl',view:'all'}]});
