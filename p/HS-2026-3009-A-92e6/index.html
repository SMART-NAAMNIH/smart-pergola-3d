// ===== Saleh Dabbah — Deir al-Asad. L-shaped terrace around the house. metres. z=0 = outer (top) edge

const PM=new THREE.MeshStandardMaterial({color:0xe3d9bd,roughness:.55,metalness:.25});
const GL=new THREE.MeshStandardMaterial({color:0x9fc3d6,roughness:.05,metalness:.2,transparent:true,opacity:.28});
const G=new THREE.Group();S.add(G);const H=3.3;
// floor slab + tiles
box(19.5,.3,21,stoneMat(19.5,.3),8.8,-.15,9.5,G);
const fl=new THREE.Mesh(new THREE.PlaneGeometry(19.5,21),new THREE.MeshStandardMaterial({map:(()=>{const t=TT.clone();t.needsUpdate=true;t.repeat.set(19.5/.8,21/.8);return t})(),roughness:.8}));
fl.rotation.x=-Math.PI/2;fl.position.set(8.8,.01,9.5);fl.receiveShadow=true;G.add(fl);
// house block inside the L
box(8.54,7.2,9.45,stoneMat(9.45,7.2),13.4,3.6,14.27,G);
[[10.5],[13.4],[16.3]].forEach(([x])=>{box(1.8,2.4,.05,M.glass,x,1.2,9.53,G);box(2,.12,.12,M.cap,x,2.46,9.52,G)});
[[11.5],[15.5]].forEach(([z])=>{box(.05,2.4,1.8,M.glass,9.11,1.2,z,G)});
// parapet on outer edge (h 1.24) + glass above
box(17.67,1.24,.25,stoneMat(17.67,1.24),8.835,.62,.12,G);box(17.8,.07,.35,M.cap,8.835,1.27,.12,G);
function glass(x1,z1,x2,z2,y0,h){const L=Math.hypot(x2-x1,z2-z1),n=Math.max(2,Math.round(L/1.0));
 const a=Math.atan2(z2-z1,x2-x1);const g=new THREE.Group();g.position.set(x1,y0,z1);g.rotation.y=-a;G.add(g);
 box(L,.05,.1,PM,L/2,.025,0,g);box(L,.05,.1,PM,L/2,h-.025,0,g);
 for(let i=0;i<n;i++){const w=L/n;box(w-.02,h-.1,.02,GL,w*(i+.5),h/2,(i%2)*.04-.02,g);box(.04,h-.1,.05,PM,w*i+.02,h/2,(i%2)*.04-.02,g)}}
glass(0,.12,17.67,.12,1.3,H-1.3);            // 1767 × 206
glass(.12,0,.12,10.1,1.24,H-1.24);            // 1010 × 206 (left, on parapet)
box(.25,1.24,10.1,stoneMat(10.1,1.24),.12,.62,5.05,G);
glass(.12,11.5,.12,19.0,0,H);                 // 752 × 330
glass(17.55,0,17.55,3.8,0,H);                 // 380 × 330
// ---------- SKYTEKS Slide unit: panels 20.6 cm across D, gather toward z0
function sky(x0,z0,W,D){const u={g:new THREE.Group(),x0,z0,W,D,sky:1};G.add(u.g);
 const y=H;box(W,.2,.12,PM,x0+W/2,y-.1,z0,u.g);box(W,.2,.12,PM,x0+W/2,y-.1,z0+D,u.g);
 box(.12,.2,D,PM,x0,y-.1,z0+D/2,u.g);box(.12,.2,D,PM,x0+W,y-.1,z0+D/2,u.g);
 const l=box(.03,.012,D-.3,M.led,x0+W/2,y-.21,z0+D/2,u.g);leds.push(l);
 const p=new THREE.PointLight(0xffd9a0,0,7,2);p.position.set(x0+W/2,y-.6,z0+D/2);u.g.add(p);lamps.push(p);
 u.fab=new THREE.Group();u.g.add(u.fab);u.n=Math.round((D-.1)/.206);units.push(u);return u}
function setFabric(u,t){u.fab.clear();const pw=(u.D-.1)/u.n;
 for(let k=0;k<u.n;k++){const z=u.z0+.05+pw*(k+.5)*(1-t)+(t?k*.03:0);box(u.W-.14,.035,pw*(1-t)+.03*t+(1-t)*.0,PM,u.x0+u.W/2,H-.02+(t?k*.004:0),z,u.fab)}}
function post(x,z){box(.16,H-.2,.16,PM,x,(H-.2)/2,z,G)}
// section 1: 17.67 × 9.54 → 5 cols × 2 rows
const c1=17.67/5,r1=4.2,r2=9.54-4.2;
for(let i=0;i<5;i++){sky(c1*i,0,c1,r1);sky(c1*i,r1,c1,r2)}
// section 2: 9.0 × 9.45 → 2 cols × 2 rows
for(let i=0;i<2;i++){sky(4.5*i,9.54,4.5,4.72);sky(4.5*i,14.26,4.5,4.73)}

for(let i=1;i<5;i++)post(c1*i,0);
SP.start({
 views:{all:[[-9,12,-10],[8,1.5,8]], side:[[-7,4.5,22],[5,2.2,8]], inside:[[4.5,1.8,17.5],[7,2.8,3]]},

});
