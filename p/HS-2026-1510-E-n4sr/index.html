<script>
// ===== المشهد الخاص بالمشروع — بالمتر =====
M.alu.color.set(0xa4927c); M.alu.roughness=.5;
const GL=new THREE.MeshStandardMaterial({color:0x9fc3d6,roughness:.05,metalness:.2,transparent:true,opacity:.35,side:THREE.DoubleSide});
const stucco=(w,h)=>new THREE.MeshStandardMaterial({color:0xcdb68a,roughness:.95});
const glassU=[];
// غيوتين: إطار + 3 ألواح؛ الفتح يُنزل اللوحين العلويين فوق السفلي
function guillotine(g,x,y,z,W,H,rotY){
 const u=new THREE.Group();u.position.set(x,y,z);u.rotation.y=rotY||0;g.add(u);
 const f=.06;box(W,f,.12,M.alu,W/2,f/2,0,u);box(W,f,.12,M.alu,W/2,H-f/2,0,u);
 box(f,H,.12,M.alu,f/2,H/2,0,u);box(f,H,.12,M.alu,W-f/2,H/2,0,u);
 const ph=(H-2*f)/3,P=[];
 for(let i=0;i<3;i++){const p=new THREE.Group();u.add(p);
  box(W-2*f,ph-.03,.02,GL,0,0,0,p);box(W-2*f,.04,.05,M.alu,0,ph/2-.02,0,p);box(W-2*f,.04,.05,M.alu,0,-ph/2+.02,0,p);
  p.userData.base=f+ph/2+i*ph;p.userData.i=i;p.position.set(W/2,p.userData.base,(i-1)*.035);P.push(p)}
 glassU.push(t=>P.forEach(p=>{p.position.y=p.userData.base-t*p.userData.i*ph}));}
// منزلق Sürme Plus: 4 ألواح؛ الفتح يجمعها نحو اليمين
function sliding(g,x,y,z,W,H){
 const u=new THREE.Group();u.position.set(x,y,z);g.add(u);const f=.05;
 box(W,f,.1,M.alu,W/2,f/2,0,u);box(W,f,.1,M.alu,W/2,H-f/2,0,u);box(f,H,.1,M.alu,f/2,H/2,0,u);box(f,H,.1,M.alu,W-f/2,H/2,0,u);
 const n=4,pw=(W-2*f)/n,P=[];
 for(let i=0;i<n;i++){const p=new THREE.Group();u.add(p);box(pw-.02,H-2*f,.02,GL,0,0,0,p);
  box(.04,H-2*f,.04,M.alu,-pw/2+.02,0,0,p);box(.04,H-2*f,.04,M.alu,pw/2-.02,0,0,p);
  p.userData.x0=f+pw/2+i*pw;p.position.set(p.userData.x0,H/2,(i%2?.02:-.02)+(i-1.5)*.012);P.push(p)}
 const xe=W-f-pw/2;glassU.push(t=>P.forEach((p,i)=>{p.position.x=p.userData.x0+(xe-p.userData.x0-(n-1-i)*.03)*t}));}
// زجاج ثابت
function fixedG(g,x,y,z,W,H,rotY){const u=new THREE.Group();u.position.set(x,y,z);u.rotation.y=rotY||0;g.add(u);const f=.05;
 box(W-2*f,H-2*f,.02,GL,W/2,H/2,0,u);box(W,f,.08,M.alu,W/2,f/2,0,u);box(W,f,.08,M.alu,W/2,H-f/2,0,u);
 box(f,H,.08,M.alu,f/2,H/2,0,u);box(f,H,.08,M.alu,W-f/2,H/2,0,u);}
function setOpen(t){glassU.forEach(fn=>fn(t))}

// ---------- المشروع 1: شرفة البيت الحجري — واجهة 670 سم
const G1=new THREE.Group(),G2=new THREE.Group();S.add(G1,G2);
(function(){const g=G1,D=2.4,W=6.7,hp=.78,hg=2.08;
 box(W+1.2,.3,D+.4,stoneMat(W+1.2,.3),W/2,-.15,-D/2+.2,g);                      // البلاطة
 const fl=new THREE.Mesh(new THREE.PlaneGeometry(W,D),new THREE.MeshStandardMaterial({map:(()=>{const t=TT.clone();t.needsUpdate=true;t.repeat.set(W/.6,D/.6);return t})(),roughness:.8}));
 fl.rotation.x=-Math.PI/2;fl.position.set(W/2,.01,-D/2);g.add(fl);
 box(W+3,6,.4,stoneMat(W+3,6),W/2,2.5,-D-.2,g);                                  // جدار البيت
 box(1.4,2.2,.05,M.glass,1.6,1.1,-D+.01,g);box(1.2,1.3,.05,M.glass,4.6,1.4,-D+.01,g);
 box(W,hp,.3,stoneMat(W,hp),W/2,hp/2,.15,g);box(W+.1,.06,.38,M.cap,W/2,hp+.03,.15,g); // الحفة الحجرية
 box(.3,hp+hg,D,stoneMat(D,3),W+.15,(hp+hg)/2,-D/2,g);                             // الجدار الجانبي
 box(W+.6,.5,D+.6,stoneMat(W+.6,.5),W/2,hp+hg+.25,-D/2+.15,g);                    // السقف
 guillotine(g,0,hp+.06,.15,2.23,hg);guillotine(g,2.23,hp+.06,.15,2.23,hg);
 sliding(g,4.46,hp+.06,.15,2.24,hg);})();

// ---------- المشروع 2: الشرفة العلوية — 75+400+75 أمام، 60 و85 جانبان، ارتفاع 238
(function(){const g=G2;g.position.set(40,0,0);const W=5.5,hp=.25,hg=2.38,dL=.6,dR=.85,D=1.9;
 box(W+1,.3,D+.6,stucco(),W/2,-.15,-D/2+.25,g);
 const fl=new THREE.Mesh(new THREE.PlaneGeometry(W,D),new THREE.MeshStandardMaterial({map:(()=>{const t=TT.clone();t.needsUpdate=true;t.repeat.set(W/.6,D/.6);return t})(),roughness:.8}));
 fl.rotation.x=-Math.PI/2;fl.position.set(W/2,.01,-D/2);g.add(fl);
 box(W+2,5.5,.4,stucco(),W/2,2.2,-D-.2,g);box(3.2,2.4,.05,M.glass,2.75,1.2,-D+.01,g);   // الجدار الخلفي
 box(.3,hp+hg,D-dL,stucco(),-.15,(hp+hg)/2,-(D+dL)/2,g);box(.3,hp+hg,D-dR,stucco(),W+.15,(hp+hg)/2,-(D+dR)/2,g); // جدران جانبية
 box(W+.3,hp,.25,stucco(),W/2,hp/2,.12,g);box(.25,hp,dL,stucco(),.0,hp/2,-dL/2,g);box(.25,hp,dR,stucco(),W,hp/2,-dR/2,g);
 box(W+.9,.55,D+.9,stucco(),W/2,hp+hg+.27,-D/2+.2,g);                             // السقف
 const y=hp;fixedG(g,0,y,.12,.75,hg);guillotine(g,.75,y,.12,2.0,hg);guillotine(g,2.75,y,.12,2.0,hg);fixedG(g,4.75,y,.12,.75,hg);
 fixedG(g,0,y,-dL,dL,hg,-Math.PI/2);fixedG(g,W,y,0,dR,hg,Math.PI/2);})();
SP.start({
 views:{all:[[-2.5,3.2,7.5],[3.3,1.7,-.6]], side:[[9.5,2.8,4.8],[3.2,1.7,-.8]], inside:[[46.5,3.3,6.2],[42.7,1.4,-.5]],
        p1:[[-2.5,3.2,7.5],[3.3,1.7,-.6]], p2:[[46.5,3.3,6.2],[42.7,1.4,-.5]]},
 projects:[{label:'المشروع 1 · غيوتين + منزلق',view:'p1'},{label:'المشروع 2 · غيوتين + زجاج ثابت',view:'p2'}],
 labels:{open:'فتح الزجاج'}
});
