<script>
M.alu.color.set(0x151515); M.fab.color.set(0xd8cdb8);
const clear=new THREE.MeshStandardMaterial({color:0xaad0e0,roughness:.05,metalness:.1,transparent:true,opacity:.28,side:THREE.DoubleSide});
const black=new THREE.MeshStandardMaterial({color:0x1b1d20,roughness:.35,metalness:.2});
const W=7.8,D=8.6,hf=2.62,hb=hf+.12*D+.24;
function tri(g,x,z0,z1,y0,y1a,y1b){ // vertical glass triangle/trapezoid in plane x
 const gg=new THREE.BufferGeometry();
 gg.setAttribute('position',new THREE.Float32BufferAttribute([x,y0,z0, x,y1a,z0, x,y0,z1, x,y1b,z1],3));
 gg.setIndex([0,1,2,1,3,2]);gg.computeVertexNormals();g.add(new THREE.Mesh(gg,clear));
 beam(V(x,y1a,z0),V(x,y1b,z1),.05,.05,M.alu,g);}
function scene(g,withGlass){
 const fl=new THREE.Mesh(new THREE.PlaneGeometry(16,14),new THREE.MeshStandardMaterial({map:(()=>{const t=TT.clone();t.needsUpdate=true;t.repeat.set(16/.8,14/.8);return t})(),roughness:.8}));
 fl.rotation.x=-Math.PI/2;fl.position.set(3.9,0,5);fl.receiveShadow=true;g.add(fl);
 box(14,5.2,.4,black,3.9,2.6,-.2,g);                                   // black shop facade
 box(6.5,2.7,.05,M.glass,3.9,1.35,.01,g); box(6.7,.12,.08,M.dark,3.9,2.75,.03,g);
 box(10,.5,.06,M.cap,3.9,4.6,.02,g);                                   // sign band
 // planters along front
 [[1.2],[6.6]].forEach(([x])=>box(1.6,.6,.5,black,x,.3,D+1.0,g));
 const u1=rts(g,0,W/2,D,hf,hb,[{x:.07,y:0},{x:W/2,y:0}]);
 const u2=rts(g,W/2,W/2,D,hf,hb,[{x:W-.07,y:0}]);
 if(!withGlass) return;
 const gh=2.5;
 // front glass with central entrance door 2.2 m
 const d0=W/2-1.1,d1=W/2+1.1;
 [[0,d0],[d1,W]].forEach(([a,b])=>{box(b-a,gh,.03,clear,(a+b)/2,gh/2,D,g);
   for(let k=0;k<=4;k++){box(.04,gh,.06,M.alu,a+(b-a)*k/4,gh/2,D,g)} box(b-a,.06,.08,M.alu,(a+b)/2,.03,D,g);box(b-a,.06,.08,M.alu,(a+b)/2,gh,D,g)});
 box(2.2,gh,.04,clear,W/2,gh/2,D+.02,g); [d0,W/2,d1].forEach(x=>box(.07,gh,.08,M.alu,x,gh/2,D+.02,g)); box(2.2,.08,.1,M.alu,W/2,gh,D+.02,g);
 box(.04,.5,.04,M.dark,W/2-.12,1.05,D+.07,g); box(.04,.5,.04,M.dark,W/2+.12,1.05,D+.07,g);
 // sides: sliding glass + fixed triangles above
 [0.03,W-.03].forEach((x,i)=>{
   box(.03,gh,D-.1,clear,x,gh/2,D/2,g);
   for(let k=0;k<=6;k++){box(.06,gh,.04,M.alu,x,gh/2,.05+(D-.1)*k/6,g)}
   box(.08,.06,D,M.alu,x,gh,D/2,g); box(.08,.06,D,M.alu,x,.03,D/2,g);
   tri(g,x,.06,D,gh,hb-.05,hf-.05);
   if(i===1){box(.05,2.3,1.1,M.alu,x+.01,1.15,6.4,g); box(.04,2.2,1.0,clear,x+.03,1.1,6.4,g); box(.06,.08,.5,M.dark,x+.05,1.05,6.2,g)} // emergency door
 });
}
const G1=new THREE.Group(),G2=new THREE.Group();S.add(G1,G2);
scene(G1,true); G2.position.set(40,0,0); scene(G2,false);
SP.start({
 views:{all:[[-6.5,5.2,17],[3.9,1.8,4.5]], side:[[15.5,4.5,13.5],[3.9,1.8,4.3]], inside:[[3.2,1.7,1.6],[4.4,1.9,9.5]], p2:[[33.5,5.2,17],[43.9,1.8,4.5]]},
 projects:[{label:'الاقتراح 1 · مع زجاج',view:'all'},{label:'الاقتراح 2 · بدون زجاج',view:'p2'}]
});
