<title>Smart Pergola — تصميم ثلاثي الأبعاد · HS-2026-2909-E</title>
<style>
:root{--teal:#009BA8;--gold:#F1CC01;--navy:#12202B;--bg:#f4f7f8;--card:#fff;--mut:#5b6b75;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0f171d;--card:#16222b;--mut:#9fb0ba}}
html,body{height:100%;margin:0}body{background:var(--bg);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;color:var(--navy);display:flex;flex-direction:column}
@media (prefers-color-scheme:dark){body{color:#e8eef1}}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;background:var(--card);border-bottom:3px solid var(--gold)}
header .t{font-weight:800;color:var(--teal);font-size:16px}header .s{font-size:12px;color:var(--mut)}header img{height:38px}
#v{flex:1;min-height:320px;position:relative}#v canvas{display:block;width:100%;height:100%}
.panel{background:var(--card);padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
.panel label{display:flex;align-items:center;gap:6px}input[type=range]{width:140px;accent-color:var(--teal)}
button{font:inherit;border:1px solid var(--teal);background:transparent;color:var(--teal);border-radius:8px;padding:6px 11px;cursor:pointer}
button.on{background:var(--teal);color:#fff}
.tag{position:absolute;bottom:8px;left:8px;display:flex;align-items:flex-end;gap:6px;pointer-events:none}
.tag img{height:74px;border-radius:8px}.tag span{background:rgba(255,255,255,.92);color:#0b6f79;font-size:12px;padding:4px 8px;border-radius:8px;font-weight:700}
.spec{font-size:12px;color:var(--mut);padding:0 12px 8px;background:var(--card)}
body.shot header,body.shot .panel,body.shot .spec,body.shot .tag{display:none}
</style></head><body>

const hemi=new THREE.HemisphereLight(0xdfefff,0x9a8f7a,0.75);S.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,0.85);sun.position.set(-12,20,14);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-20,right:20,top:20,bottom:-20});S.add(sun);
const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.75,metalness:.05},o));
function box(g,w,h,d,x,y,z,m){const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);b.position.set(x,y,z);b.castShadow=b.receiveShadow=true;g.add(b);return b;}
const alu=M(RAL9005,{roughness:.55,metalness:.3}), steel=M(0x1b1c1e,{roughness:.5,metalness:.4});
let leds=[], movers=[], state={p:0,open:0,night:false};
function ledStrip(g,len,x,y,z,rotY){const m=new THREE.MeshBasicMaterial({color:0x333333});const b=box(g,len,.02,.03,x,y,z,m);b.rotation.y=rotY||0;b.castShadow=false;leds.push(b);const L=new THREE.PointLight(0xffd9a0,0,6,2);L.position.set(x,y-.15,z);g.add(L);leds.push(L);}
function wallWithWindows(g,len,h,z,wins){box(g,len,h,.3,0,h/2,z-.15,M(STONE));for(const [x,y,w,hh] of wins){box(g,w,hh,.05,x,y,z+.01,M(0xcfcac0));box(g,w+.16,.08,.1,x,y-hh/2-.04,z+.04,M(0xf6f1e6));}}
function fence(g,len,x,z,base,h,rotY){const f=new THREE.Group();box(f,len,base,.3,0,base/2,0,M(CONC));for(let i=-len/2+.06;i<len/2;i+=.13)box(f,.08,h,.04,i,base+h/2,0,M(FENCE));f.position.set(x,0,z);f.rotation.y=rotY||0;g.add(f);return f;}
function tree(g,x,z,s){box(g,.25,1.6*s,.25,x,.8*s,z,M(0x6b5a45));const c=new THREE.Mesh(new THREE.SphereGeometry(1.5*s,16,12),M(0x7f9170));c.position.set(x,2.4*s,z);c.castShadow=true;g.add(c);}
/* RTS: width W (x), projection P (z, from rear z0 toward +z), rear height hr, front posts */
function rts(g,W,P,hr,opt){const fall=P*0.12,hf=hr-fall,rails=W>7?4:(W>4.5?3:2),z0=opt.z0||0;const grp=new THREE.Group();g.add(grp);
 const ang=Math.atan2(fall,P),len=Math.hypot(P,fall);
 for(let i=0;i<rails;i++){const x=-W/2+i*W/(rails-1);const r=box(grp,.1,.14,len,x,(hr+hf)/2,z0+P/2,alu);r.rotation.x=ang;
  const pb=opt.postBase||0; if(!opt.noFrontPosts)box(grp,.1,hf-pb,.1,x,pb+(hf-pb)/2,z0+P-.05,alu);
  if(opt.rearSteel){const ph=hr+1.0;box(grp,.12,ph,.12,x,ph/2,z0-.12,steel);
   if(opt.ties){const ax=hr+.95,az=z0-.1,bz=z0+P*.62,by=hr-fall*.62+.05,dy=ax-by,dz=bz-az,ln=Math.hypot(dy,dz);const tb=box(grp,.03,.03,ln,x,(ax+by)/2,(az+bz)/2,steel);tb.rotation.x=Math.atan2(dy,dz);}}}
 box(grp,W+.1,.16,.16,0,hr+.05,z0+.05,alu);box(grp,W+.1,.18,.14,0,hf-.02,z0+P-.05,alu);
 ledStrip(grp,W-.2,0,hf-.13,z0+P-.12);
 // fabric panels per bay (folds toward rear when opening)
 for(let i=0;i<rails-1;i++){const bw=W/(rails-1)-.1,x=-W/2+(i+.5)*W/(rails-1);
  const m=new THREE.Mesh(new THREE.BoxGeometry(bw,.02,1),M(FAB,{roughness:.9}));m.castShadow=true;grp.add(m);
  movers.push(o=>{const L=Math.max(.25,len*(1-o*.85));m.scale.z=L;const c=len-L/2;m.position.set(x,hr-(c/len)*fall+.04,z0+(c/len)*P);m.position.set(x,hr-((len-c)/len)*fall*0+0,0);
   const t=(len-L/2)/len;m.position.set(x,hr+.06-(1-t)*0-(t)*0,0);
   const f=L/2/len; m.position.set(x,hr+.1-f*fall,z0+f*P); m.rotation.x=ang;});}
 return grp;}
/* SKYTEKS Slide: flat frame, sliding panels */
function slide(g,W,P,h,x0,z0){const grp=new THREE.Group();grp.position.set(x0,0,z0);g.add(grp);
 box(grp,W,.22,.16,0,h,0,alu);box(grp,W,.22,.16,0,h,P,alu);box(grp,.16,.22,P,-W/2,h,P/2,alu);box(grp,.16,.22,P,W/2,h,P/2,alu);
 ledStrip(grp,W-.3,0,h-.13,P-.1);
 const n=Math.max(3,Math.round(P/.6)),pw=P/n;const panels=[];
 for(let i=0;i<n;i++){const m=box(grp,W-.2,.05,pw+.02,0,h+.02,0,M(RAL1013,{roughness:.6,metalness:.1}));panels.push(m);}
 movers.push(o=>{panels.forEach((m,i)=>{const closedZ=pw*(i+.5),openZ=.18+i*.03;m.position.z=closedZ+(openZ-closedZ)*o;m.position.y=h+.02+i*.035*o;});});
 return grp;}
const projects=[];
function mk(name,sub,build,camPos,target){const g=new THREE.Group();build(g);g.visible=false;S.add(g);projects.push({g,sub,camPos,target});}
// ground
const gr=new THREE.Mesh(new THREE.PlaneGeometry(80,80),M(0xcfd6c4));gr.rotation.x=-Math.PI/2;gr.position.y=-.01;gr.receiveShadow=true;S.add(gr);
// P1 back of house
mk('p1','المشروع ١ · خلف البيت · RTS 1300 PVC · ‏806 × 315 سم · الأعمدة الأمامية على السور الأمامي · ارتفاع الواجهة 240 سم · RAL 9005 · قماش B8116/1622',g=>{
 box(g,14,.05,6,0,.02,2.6,M(FLOOR));wallWithWindows(g,14,6.2,0,[[-4.5,1.6,1,1.4],[-1.5,1.6,1.1,1.6],[2.8,1.3,1.2,2.4],[5.5,4.5,1.2,1.4]]);
 box(g,14,.7,.35,0,.35,3.2,M(STONE));fence(g,14,0,3.37,.7,1.6);rts(g,8.06,3.15,2.78,{postBase:.7});
},[6.6,3.3,3.95],[-1.2,2.0,1.1]);
// P2 front, hung on fence
mk('p2','المشروع ٢ · أمام البيت · RTS 1300 PVC · ‏620 × 420 سم · معلّقة بشدّادات على أعمدة حديد عند السور · بدون أعمدة أمامية · RAL 9005 · قماش B8116/1622',g=>{
 box(g,16,.05,11,0,.02,4.5,M(0xd8d3c8));fence(g,16,0,-.2,1.4,1.1);tree(g,-6.2,2.5,1.1);
 box(g,16,6.5,.3,0,3.25,12.5,M(STONE));
 const gg=new THREE.Group();gg.position.set(.8,0,0);g.add(gg);rts(gg,6.2,4.2,3.1,{rearSteel:true,noFrontPosts:true,ties:true,z0:.05});
 const gm=new THREE.Mesh(new THREE.BoxGeometry(3,.03,2),M(0x4f8a3b));gm.position.set(-3.6,.05,1.6);g.add(gm);
},[-7.5,4.3,8.6],[.6,1.9,2.2]);
// P3 balcony top, no posts
mk('p3','المشروع ٣ · فوق الشرفة · SKYTEKS Slide · وحدتان ‏238 × 332 و‏180 × 235 سم · فوق الجسر الباطون · بدون أعمدة أمامية · هيكل RAL 9005 · الأجنحة RAL 1013',g=>{
 box(g,12,.05,6,0,.02,4,M(0xd8d3c8));
 box(g,10,9.2,.3,0,4.6,-.15,M(STONE)); // back facade
 box(g,4.6,.35,3.5,0,3.3,1.75,M(STONE)); // balcony slab
 box(g,.25,2.9,3.5,-2.3,4.9,1.75,M(STONE));box(g,.25,2.9,3.5,2.3,4.9,1.75,M(STONE)); // side walls
 const rail=new THREE.Group();g.add(rail);box(rail,4.35,.05,.05,0,4.55,3.45,alu);for(let x=-2.1;x<=2.1;x+=.22)box(rail,.03,1,.03,x,4.05,3.45,alu);
 box(g,4.6,.08,.08,0,6.35,3.5,M(STONE));
 box(g,1.4,2.3,.05,0,4.6,.02,M(0x2b2f33));
 slide(g,2.38,3.32,6.35,.9,.1);slide(g,1.80,2.35,6.35,-1.2,1.07);box(g,1.9,2.9,.97,-1.2,4.9,.55,M(STONE));
},[5.2,10.2,9.2],[0,5.6,1.6]);
function setProject(i){state.p=i;projects.forEach((p,j)=>p.g.visible=j===i);const p=projects[i];cam.position.set(...p.camPos);ctl.target.set(...p.target);ctl.update();document.getElementById('sub').textContent=p.sub;
 document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('on',+b.dataset.p===i));}
function setOpen(o){state.open=o;movers.forEach(f=>f(o));document.getElementById('ov').textContent=o<.05?'مغلق':(o>.95?'مفتوح':'مفتوح جزئياً');document.getElementById('open').value=Math.round(o*100);}
function setNight(n){state.night=n;S.background=new THREE.Color(n?0x0d1624:0xbfdcf2);hemi.intensity=n?.12:.75;sun.intensity=n?.03:.85;
 leds.forEach(l=>{if(l.isLight)l.intensity=n?1.6:0;else l.material.color.set(n?0xfff1c9:0x333333);});document.getElementById('led').classList.toggle('on',n);}
function view(pos,target){cam.position.set(...pos);ctl.target.set(...target);ctl.update();}
window.api={setProject,setOpen,setNight,view};
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>setProject(+b.dataset.p));
document.getElementById('open').oninput=e=>setOpen(e.target.value/100);
document.getElementById('led').onclick=()=>setNight(!state.night);
let anim=null;document.getElementById('anim').onclick=()=>{const from=state.open,to=from>.5?0:1,t0=performance.now();anim=t=>{const k=Math.min(1,(t-t0)/2500);setOpen(from+(to-from)*k);if(k<1)requestAnimationFrame(anim);};requestAnimationFrame(anim);};
function resize(){const w=host.clientWidth,h=host.clientHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
addEventListener('resize',resize);
const qs=new URLSearchParams(location.search);setProject(+(qs.get('p')||0));setOpen(0);setNight(false);resize();
(function loop(){ctl.update();R.render(S,cam);requestAnimationFrame(loop);})();
</script></body></html>
