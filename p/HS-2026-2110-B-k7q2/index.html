<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Smart Pergola · تصميم ثلاثي الأبعاد · HS-2026-2110-B</title>
<link rel="stylesheet" href="../../viewer/viewer.css">
</head>
<body>
<canvas id="c"></canvas>
<div class="bar"><div><b>SMART</b> Pergola<small>عرابة · سطح · ستائر Zip Screen · RAL 7016</small></div></div>
<div class="panel" id="panel"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="../../viewer/engine.js"></script>
<script>
// ===== سطح في عرابة: برجولا قائمة + وحدتا Zip Screen (الأبعاد بالمتر، توضيحية) =====
M.alu.color.set(0x383e42);                       // RAL 7016 أنثراسيت
const ZF=new THREE.MeshStandardMaterial({color:0x3e4246,roughness:.9,transparent:true,opacity:.9,side:THREE.DoubleSide});
const W=4.6,D=4.0,HT=2.32,WALL=0.72;             // الواجهة، البروز (توضيحي)، ارتفاع أسفل الجسر، ارتفاع السور الخلفي
const g=new THREE.Group();S.add(g);
// أرضية السطح
const fl=new THREE.Mesh(new THREE.PlaneGeometry(14,12),new THREE.MeshStandardMaterial({map:(()=>{const t=TT.clone();t.needsUpdate=true;t.repeat.set(14/.8,12/.8);return t})(),roughness:.8,color:0xb9bcbf}));
fl.rotation.x=-Math.PI/2;fl.position.set(2.3,0,2);fl.receiveShadow=true;g.add(fl);
const white=new THREE.MeshStandardMaterial({color:0xeeeeea,roughness:.9});
// السور الخلفي والجانبي للسطح + جدار البيت المجاور
box(10,WALL,.25,white,2.3,WALL/2,-.25,g);
box(.25,1.1,8,white,-2.6,.55,2,g);
box(.4,5.5,7,stoneMat(7,5.5),-3.0,2.75,1.5,g);
// سياج شرائح خلف السور
for(let i=0;i<7;i++)box(10,.09,.04,new THREE.MeshStandardMaterial({color:0xddd6c6}),2.3,WALL+.15+i*.17,-.32,g);
// المبنى الخلفي
box(9,9,.4,new THREE.MeshStandardMaterial({color:0xd8b98e,roughness:.95}),3.2,4.5,-4.5,g);
// وحدة مكيّف
box(.8,.55,.3,white,6.2,1.0,-.05,g);
// ---------- البرجولا القائمة (ألمنيوم بشرائح)
const P=[[0,0],[W,0],[0,D],[W,D]];
P.forEach(([x,z])=>box(.15,HT+.25,.15,M.alu,x,(HT+.25)/2,z,g));
box(W+.15,.25,.15,M.alu,W/2,HT+.125,0,g);box(W+.15,.25,.15,M.alu,W/2,HT+.125,D,g);
box(.15,.25,D,M.alu,0,HT+.125,D/2,g);box(.15,.25,D,M.alu,W,HT+.125,D/2,g);
for(let z=.15;z<D-.05;z+=.19)box(W-.15,.03,.16,M.alu,W/2,HT+.2,z,g);
// ---------- ستائر Zip: صندوق علوي + سكك جانبية + قماش يُلفّ للأعلى
const zips=[];
function zip(z,bottom,label){
 const h=HT-bottom;box(W-.15,.13,.13,M.alu,W/2,HT-.07,z,g);
 [.11,W-.11].forEach(x=>box(.05,h,.07,M.alu,x,bottom+h/2,z,g));
 const m=new THREE.Mesh(new THREE.PlaneGeometry(1,1),ZF);m.castShadow=true;g.add(m);
 const bar=box(W-.25,.04,.05,M.alu,W/2,bottom,z,g);
 const u={z,bottom,h,m,bar};zips.push(u);return u}
zip(D+.02,0,'front');          // الواجهة 460×232
zip(-.02,WALL,'back');         // فوق السور 460×160
setOpen=function(t){zips.forEach(u=>{const hh=Math.max(.04,u.h*(1-t));
 u.m.scale.set(W-.22,hh,1);u.m.position.set(W/2,HT-.13-hh/2,u.z);u.bar.position.y=HT-.13-hh})};
SP.start({
 views:{all:[[-1.2,3.4,11.5],[2.3,1.2,1.8]], side:[[9.8,3.2,8.2],[2.3,1.2,1.8]], inside:[[3.6,1.6,3.2],[1.6,1.0,-.6]]},
 projects:[{label:'منظر عام',view:'all'},{label:'جانبي',view:'side'},{label:'من الداخل',view:'inside'}]
});
</script>
</body>
</html>
