<div class="spec">نموذج توضيحي بالمقاسات من مخطط الإنتاج (28.09.2026) والصور الميدانية. الألوان والتفاصيل تقريبية؛ المرجع النهائي هو مخطط الإنتاج والقياس الميداني.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const V=document.getElementById('v');
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;V.appendChild(R.domElement);
const S=new THREE.Scene();const sky=new THREE.Color(0x9cc9ec);S.background=sky;
const C=new THREE.PerspectiveCamera(50,1,0.05,200);
const O=new THREE.OrbitControls(C,R.domElement);O.target.set(2.6,1.6,1.5);O.enableDamping=true;O.maxPolarAngle=Math.PI*0.52;
const hemi=new THREE.HemisphereLight(0xffffff,0x8a7f70,0.75);S.add(hemi);
const sun=new THREE.DirectionalLight(0xfff1dc,0.95);sun.position.set(-6,10,9);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-8,right:8,top:8,bottom:-8});S.add(sun);
const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.8},o));
function box(w,h,d,x,y,z,m){const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);b.position.set(x,y,z);b.castShadow=b.receiveShadow=true;S.add(b);return b}
// ---- site (x: along wall 0..5.16, z: out from wall, y: up) ----
const wallM=M(0xcbbd9f),tileM=M(0xc9c6bd),stoneM=M(0xd9d4c7);
box(9,0.2,4.2,2.4,-0.1,1.7,tileM);                       // floor
box(9,4.0,0.3,2.4,2.0,-0.15,wallM);                       // main wall
box(9,0.12,0.12,2.4,3.35,0.06,M(0xc4b595));               // cornice band
box(0.3,4.0,4.2,5.75,2.0,1.7,wallM);                      // end wall (door side)
box(0.02,2.3,1.6,5.59,1.15,1.4,M(0x1e2326,{roughness:.3,metalness:.3})); // door glass
box(0.04,0.25,1.8,5.57,2.45,1.4,M(0xf2f2f2));             // shutter box
box(0.5,0.3,0.12,1.4,2.95,0.06,M(0xf4f4f4));              // wall light (to relocate)
box(0.2,0.2,0.04,0.7,3.0,0.02,M(0xe8e0d0));               // vent
// parapet 48cm + railing
box(6.2,0.48,0.25,2.6,0.24,3.08,stoneM);box(0.25,0.48,3.2,-0.4,0.24,1.6,stoneM);
const railM=M(0x5a5c5e,{metalness:.6,roughness:.45});
box(6.2,0.04,0.04,2.6,1.4,3.08,railM);box(0.04,0.04,3.2,-0.4,1.4,1.6,railM);
for(let x=-0.4;x<5.7;x+=0.12)box(0.015,0.92,0.015,x,0.94,3.08,railM);
for(let z=0.1;z<3.1;z+=0.12)box(0.015,0.92,0.015,-0.4,0.94,z,railM);
// ---- pergola RTS 1300 ----
const alu=M(0xa28f7a,{metalness:.35,roughness:.55});     // RAL 1019
const W=5.16,P=2.96,yW=3.20,yF=2.563,zF=2.91,slope=(yW-yF)/zF;
const yAt=z=>yW-slope*z;
box(W,0.10,0.05,W/2,yW,0.03,M(0x4a4a4a,{metalness:.5}));   // steel 50x100
[0.035,W/2,W-0.035].forEach(x=>{box(0.13,yF-0.48,0.13,x,0.48+(yF-0.48)/2,zF,alu);}); // posts on parapet
box(5.21,0.14,0.14,W/2,yF-0.02,zF+0.06,alu);                // gutter
const len=Math.hypot(zF,yW-yF),ang=Math.atan2(yW-yF,zF);
function slopeBox(w,h,x,m){const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,len),m);b.position.set(x,(yW+yF)/2+0.06,zF/2);b.rotation.x=ang;b.castShadow=true;S.add(b);return b}
[0.035,W/2,W-0.035].forEach(x=>slopeBox(0.13,0.13,x,alu));  // 3 rails (2 sections)
const ledM=new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xfff0c8,emissiveIntensity:0});
[0.035,W/2,W-0.035].forEach(x=>{const l=slopeBox(0.03,0.01,x,ledM);l.position.y-=0.07;});
// fabric: two panels, each made of folds that gather toward the wall
const fabM=M(0xe9e3d6,{side:THREE.DoubleSide,roughness:.95});
const bays=[[0.1,W/2-0.065],[W/2+0.065,W-0.1]],N=9,panels=[];
bays.forEach(([a,b])=>{for(let i=0;i<N;i++){const m=new THREE.Mesh(new THREE.BoxGeometry(b-a,0.012,len/N),fabM);m.castShadow=true;m.userData={x:(a+b)/2,i};S.add(m);panels.push(m)}
 for(let i=0;i<=N;i++){const pr=slopeBox(b-a,0.03,(a+b)/2,alu);pr.scale.z=0.03/len;pr.userData.prof=i;panels.push(pr)}});
const lights=[];[W*0.25,W*0.75].forEach(x=>{const pl=new THREE.PointLight(0xffe2a8,0,6);pl.position.set(x,2.5,1.5);S.add(pl);lights.push(pl)});
function setOpen(f){ // f=1 closed, 0 open
 const ext=0.12+0.88*f, spanZ=len*ext;
 panels.forEach(m=>{const i=m.userData.i!==undefined?m.userData.i:m.userData.prof, n=m.userData.i!==undefined?N:N;
  let s; if(m.userData.i!==undefined){s=(i+0.5)/N*spanZ;m.scale.z=ext; m.rotation.x=ang+(f<0.98?(i%2?0.35:-0.35)*(1-f):0);}
  else s=i/N*spanZ;
  const z=Math.cos(ang)*s,y=yW+0.02-Math.sin(ang)*s; m.position.set(m.userData.x!==undefined?m.userData.x:m.position.x,y,z);});
}
let open=1;setOpen(1);
const sl=document.getElementById('open'),ov=document.getElementById('ov');
function upd(v){open=v/100;setOpen(open);ov.textContent=v>95?'مغلق':v<5?'مفتوح':v+'%'}
sl.oninput=e=>upd(+e.target.value);
let anim=null;document.getElementById('anim').onclick=()=>{const tgt=open>0.5?0:100;const st=open*100,t0=performance.now();
 anim=t=>{const k=Math.min(1,(t-t0)/3500);const v=Math.round(st+(tgt-st)*k);sl.value=v;upd(v);if(k<1)requestAnimationFrame(anim)};requestAnimationFrame(anim)};
let night=false;document.getElementById('led').onclick=e=>{night=!night;e.target.classList.toggle('on',night);
 S.background=night?new THREE.Color(0x0d1422):sky;sun.intensity=night?0.02:0.95;hemi.intensity=night?0.08:0.75;
 ledM.emissiveIntensity=night?2:0;lights.forEach(l=>l.intensity=night?1.4:0)};
const views={front:[[5.1,1.6,2.7],[1.2,2.3,0.6]],side:[[2.4,2.6,8.5],[2.6,1.9,1.2]],top:[[2.6,9,4.5],[2.6,1.5,1.5]]};
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const[p,t]=views[b.dataset.v];C.position.set(...p);O.target.set(...t)});
C.position.set(...views.front[0]);O.target.set(...views.front[1]);
function rs(){const w=V.clientWidth,h=V.clientHeight;R.setSize(w,h);C.aspect=w/h;C.updateProjectionMatrix()}
addEventListener('resize',rs);rs();
(function loop(){requestAnimationFrame(loop);O.update();R.render(S,C)})();
</script></body></html>
