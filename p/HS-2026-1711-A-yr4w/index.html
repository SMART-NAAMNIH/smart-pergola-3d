<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Smart Pergola · تصميم ثلاثي الأبعاد · HS-2026-1711-A</title>
<link rel="stylesheet" href="../../viewer/viewer.css">
</head>
<body>
<canvas id="c"></canvas>
<div class="bar"><div><b>SMART</b> Pergola<small>كفرياسيف · برجولا خشب بسقف زجاجي · 4×3 م</small></div></div>
<div class="panel" id="panel"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="../../viewer/engine.js"></script>
<script>
// ===== برجولا خشب Glulam بسقف زجاج 6+6 — الأبعاد بالمتر =====
const wood=new THREE.MeshStandardMaterial({color:0xa8774a,roughness:.85});
const woodD=new THREE.MeshStandardMaterial({color:0x8a5e36,roughness:.85});
const glassT=new THREE.MeshStandardMaterial({color:0xcfe6ef,roughness:.05,metalness:.2,transparent:true,opacity:.28,side:THREE.DoubleSide});
const G=new THREE.Group();S.add(G);
(function(){
 const g=G;
 const fl=new THREE.Mesh(new THREE.PlaneGeometry(14,10),new THREE.MeshStandardMaterial({map:(()=>{const t=TT.clone();t.needsUpdate=true;t.repeat.set(14/.8,10/.8);return t})(),roughness:.8}));
 fl.rotation.x=-Math.PI/2;fl.position.set(2,0,3);fl.receiveShadow=true;g.add(fl);
 box(10,4.2,.35,stoneMat(10,4.2),2,2.1,-.175,g);                 // concrete/stone house wall
 box(1.8,2.3,.05,M.glass,1.2,1.15,.01,g); box(1.9,.1,.07,M.dark,1.2,2.35,.02,g);  // door
 box(1.2,1.2,.05,M.glass,3.3,1.6,.01,g); box(1.35,.1,.1,M.cap,3.3,.96,.04,g);      // window
 const W=4.0,D=3.0,hf=2.70,hb=3.00; const H=z=>hb+(hf-hb)*z/D;
 // ledger 12x20 on wall
 box(4.2,.20,.12,woodD,2,hb-.10,.06,g);
 // front beam 14x24 on two posts 15x15
 box(4.4,.24,.14,woodD,2,hf-.12,D,g);
 [[.1],[3.9]].forEach(([x])=>{box(.15,hf-.24,.15,wood,x,(hf-.24)/2,D,g);box(.2,.03,.2,M.dark,x,.015,D,g)});
 // 5 rafters 10x20, overhang 25cm
 for(let i=0;i<5;i++){const x=.05+3.9*i/4;
  beam(V(x,H(.06)+.1,.06),V(x,H(D+.25)+.1,D+.25),.1,.2,wood,g);
  const l=beam(V(x,H(.4)-.005,.4),V(x,H(D-.2)-.005,D-.2),.03,.01,M.led,g);leds.push(l);
  if(i<4){const p=new THREE.PointLight(0xffd9a0,0,6,2);p.position.set(x+.49,(hb+hf)/2-.5,D/2);g.add(p);lamps.push(p)}}
 // glass panels + black glazing caps
 for(let i=0;i<4;i++){const x0=.05+.975*i;
  beam(V(x0+.4875,H(.08)+.215,.08),V(x0+.4875,H(D+.3)+.215,D+.3),.96,.012,glassT,g)}
 for(let i=0;i<5;i++){const x=.05+3.9*i/4; beam(V(x,H(.06)+.23,.06),V(x,H(D+.3)+.23,D+.3),.06,.02,M.dark,g)}
 box(4.3,.06,.06,M.dark,2,hb+.27,.06,g);              // wall flashing
 box(4.3,.12,.12,M.dark,2,H(D+.3)+.12,D+.32,g);        // gutter
})();
setOpen=function(){};   // سقف ثابت
SP.start({
 views:{all:[[-3.6,3.6,8.6],[2,1.6,1.3]], side:[[8.2,3.2,5.2],[2,1.7,1.4]], inside:[[2.4,1.7,6.8],[2,2.1,0.5]]},
 projects:[{label:'البرجولا · زاوية عامة',view:'all'},{label:'من الجانب',view:'side'},{label:'من الأمام',view:'inside'}]
});
</script>
</body>
</html>
