// guillotine glass: panels along a line, from parapet top y0 to height h
const gl=new THREE.MeshStandardMaterial({color:0x9fc3d6,roughness:.05,metalness:.2,transparent:true,opacity:.28});
function gio(x1,z1,x2,z2,y0,h){const L=Math.hypot(x2-x1,z2-z1),a=Math.atan2(z2-z1,x2-x1),grp=new THREE.Group();

 box(.06,h,.1,M.alu,.03,y0+h/2,0,grp);box(.06,h,.1,M.alu,L-.03,y0+h/2,0,grp);
 for(let k=0;k<3;k++){const yy=y0+.06+(h-.12)*(k+.5)/3;box(L-.12,(h-.12)/3-.01,.02,gl,L/2,yy,(k%2?.02:-.02),grp);
  box(L-.12,.03,.05,M.alu,L/2,y0+.06+(h-.12)*(k+1)/3,0,grp)}
